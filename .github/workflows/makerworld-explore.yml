name: MakerWorld erkunden

on:
  push:
    paths: [".github/workflows/makerworld-explore.yml"]

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Such-Endpunkte testen
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          for u in \
            "https://makerworld.com/api/v1/search-service/select/design/nav?keyword=benchy&limit=3&offset=0" \
            "https://makerworld.com/api/v1/search-service/select/design2?keyword=benchy&limit=3&offset=0" \
            "https://api.bambulab.com/v1/search-service/select/design/nav?keyword=benchy&limit=3&offset=0" \
            "https://api.bambulab.com/v1/search-service/select/design2?keyword=benchy&limit=3&offset=0" \
            "https://makerworld.com/de/search/models?keyword=benchy" ; do
            echo "=================== $u"
            curl -s -L -m 20 -A "$UA" -H "Accept: application/json, text/html" -o /tmp/r.txt -w "HTTP %{http_code} %{content_type} %{size_download}B\n" "$u"
            head -c 2500 /tmp/r.txt | tr '\n' ' '; echo
          done
      - name: Antwortstruktur (JSON-Schlüssel)
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          for u in \
            "https://api.bambulab.com/v1/search-service/select/design/nav?keyword=benchy&limit=2&offset=0" \
            "https://makerworld.com/api/v1/search-service/select/design/nav?keyword=benchy&limit=2&offset=0"; do
            echo "=================== $u"
            curl -s -L -m 20 -A "$UA" "$u" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
          except Exception as e:
              print('kein JSON', e); sys.exit()
          def walk(o,p='',depth=0):
              if depth>4: return
              if isinstance(o,dict):
                  for k,v in o.items():
                      t=type(v).__name__
                      s=repr(v)[:80] if not isinstance(v,(dict,list)) else ''
                      print(f'{p}.{k} ({t}) {s}')
                      walk(v,p+'.'+k,depth+1)
              elif isinstance(o,list) and o:
                  print(f'{p}[] len={len(o)}')
                  walk(o[0],p+'[0]',depth+1)
          walk(d)
          " | head -120
          done
