name: OrcaSlicer erkunden

on:
  push:
    paths: [".github/workflows/orca-explore.yml"]

jobs:
  explore:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Werkzeuge
        run: apt-get update -qq && apt-get install -y -qq curl ca-certificates python3 file binutils > /dev/null
      - name: Release finden
        run: |
          curl -s https://api.github.com/repos/OrcaSlicer/OrcaSlicer/releases?per_page=6 | python3 -c "
          import json,sys
          for r in json.load(sys.stdin):
              print(r['tag_name'], r['prerelease'], r['published_at'])
              for a in r['assets']:
                  if 'Linux' in a['name']: print('   ', a['name'], a['size'])
          "
      - name: AppImage laden und entpacken
        run: |
          URL=$(curl -s https://api.github.com/repos/OrcaSlicer/OrcaSlicer/releases/latest | python3 -c "
          import json,sys
          r=json.load(sys.stdin)
          print([a['browser_download_url'] for a in r['assets'] if 'Linux_AppImage_Ubuntu2404_V' in a['name'] and 'aarch64' not in a['name']][0])")
          echo "URL=$URL"
          curl -sL -o /tmp/orca.AppImage "$URL" && chmod +x /tmp/orca.AppImage
          cd /tmp && ./orca.AppImage --appimage-extract > /dev/null && ls squashfs-root | head -30
          ls squashfs-root/bin squashfs-root/usr/bin 2>/dev/null | head; cat squashfs-root/AppRun | head -40
      - name: Fehlende Bibliotheken
        run: |
          cd /tmp/squashfs-root
          B=$(ls bin/orca-slicer usr/bin/orca-slicer 2>/dev/null | head -1); echo "BIN=$B"; file $B
          ldd $B | grep "not found" | sort -u || true
      - name: Abhängigkeiten installieren
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgtk-3-0t64 libwebkit2gtk-4.1-0 libgl1 libegl1 libglu1-mesa libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libsoup-3.0-0 xvfb locales > /dev/null
          cd /tmp/squashfs-root; B=$(ls bin/orca-slicer usr/bin/orca-slicer 2>/dev/null | head -1)
          echo "--- noch fehlend:"; ldd $B | grep "not found" | sort -u || true
      - name: Hilfe
        run: |
          cd /tmp/squashfs-root
          (./AppRun --help 2>&1 || true) | head -150
          echo "--- ohne Display:"; (timeout 60 ./AppRun --help 2>&1 | tail -5) || echo "exit $?"
      - name: K1-Max-Profile
        run: |
          cd /tmp/squashfs-root/resources/profiles
          ls | head -80
          echo "--- Creality-Index (K1 Max-Eintraege)"
          python3 - <<'PY'
          import json
          idx=json.load(open('Creality.json'))
          for k in ('machine_model_list','machine_list','process_list','filament_list'):
              for e in idx.get(k,[]):
                  if 'K1' in e['name'] and ('Max' in e['name'] or 'all' in e['name'].lower() or 'common' in e['name'].lower()) or e['name'].startswith('fdm') :
                      print(k, '|', e['name'], '|', e['sub_path'])
          PY
          echo "--- Maschine"; cat "Creality/machine/Creality K1 Max (0.4 nozzle).json" || true
          echo "--- Prozess-Beispiele"; ls Creality/process | grep -i "k1max\|k1 max" | head -20
          f=$(ls Creality/process | grep -i "0.20mm Standard" | grep -i "k1max\|k1 max" | head -1); echo "FILE=$f"; cat "Creality/process/$f"
          echo "--- Filamente"; ls Creality/filament | grep -i "k1\|generic" | head -40
          ls OrcaFilamentLibrary/filament 2>/dev/null | head -20
