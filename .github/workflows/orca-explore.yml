name: OrcaSlicer erkunden

on:
  push:
    paths: [".github/workflows/orca-explore.yml", "slicer-server/orca_profiles.py"]

jobs:
  explore:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates python3 file xvfb xauth \
            libgtk-3-0t64 libwebkit2gtk-4.1-0 libgl1 libegl1 libglu1-mesa libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libsoup-3.0-0 > /dev/null
      - name: OrcaSlicer 2.5.2
        run: |
          curl -sL -o /tmp/orca.AppImage https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.2.AppImage
          chmod +x /tmp/orca.AppImage && cd /tmp && ./orca.AppImage --appimage-extract > /dev/null
          du -sh /tmp/squashfs-root; ls /tmp/squashfs-root/lib | head -5; ls /tmp/squashfs-root/lib | wc -l
          file "/tmp/squashfs-root/resources/profiles/Creality.opc"
          ls "/tmp/squashfs-root/resources/profiles/Creality" | head; ls "/tmp/squashfs-root/resources/profiles/Creality/machine" | grep -i k1 | head -20
      - name: OPC-Format untersuchen
        run: |
          cd /tmp/squashfs-root/resources/profiles
          ls -la Creality.opc OrcaFilamentLibrary* 2>/dev/null | head
          od -A x -t x1z -N 64 Creality.opc
          python3 - <<'PY'
          import zipfile, gzip, lzma
          p='Creality.opc'
          print('zip?', zipfile.is_zipfile(p))
          b=open(p,'rb').read(16); print('magic', b)
          PY
          ls ../ | head -30
      - name: Datadir nach CLI-Start
        run: |
          mkdir -p /tmp/datadir && cd /tmp/squashfs-root
          timeout 120 ./AppRun --datadir /tmp/datadir --info /dev/null > /dev/null 2>&1 || true
          find /tmp/datadir -maxdepth 3 | head -30
      - name: Profile aus dem Quellcode (Tag v2.5.2)
        run: |
          apt-get install -y -qq git > /dev/null
          git clone -q --depth 1 --branch v2.5.2 --filter=blob:none --sparse https://github.com/OrcaSlicer/OrcaSlicer.git /tmp/orca-src
          cd /tmp/orca-src && git sparse-checkout set resources/profiles/Creality resources/profiles/OrcaFilamentLibrary
          ls resources/profiles/ | head; ls resources/profiles/Creality | head
          ls resources/profiles/Creality/machine | grep -i "k1" | head
          ls resources/profiles/Creality/process | grep -i "k1 max\|k1max" | head
          ls resources/profiles/Creality/filament | grep -i "k1\|generic" | head -30
          du -sh resources/profiles
      - name: Profile zusammenführen
        run: python3 slicer-server/orca_profiles.py /tmp/orca-src/resources/profiles /tmp/prof && ls -la /tmp/prof
      - name: Profile ansehen
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/prof/machine.json')); p=json.load(open('/tmp/prof/process.json')); f=json.load(open('/tmp/prof/filament_PLA.json'))
          for k in ['printable_area','printable_height','gcode_flavor','machine_start_gcode','machine_end_gcode','default_bed_type','curr_bed_type','thumbnails','thumbnails_format','use_relative_e_distances','layer_change_gcode','before_layer_change_gcode','printer_model','nozzle_diameter']:
              print('M', k, '=', repr(m.get(k))[:300])
          for k in ['layer_height','sparse_infill_density','wall_loops','enable_support','support_type','brim_type','brim_width','outer_wall_speed','inner_wall_speed','sparse_infill_speed','internal_solid_infill_speed','top_surface_speed','gap_infill_speed','support_speed','travel_speed','curr_bed_type']:
              print('P', k, '=', repr(p.get(k)))
          for k in ['nozzle_temperature','nozzle_temperature_initial_layer','hot_plate_temp','hot_plate_temp_initial_layer','textured_plate_temp','cool_plate_temp','eng_plate_temp','fan_max_speed','fan_min_speed','filament_type','filament_max_volumetric_speed','filament_density']:
              print('F', k, '=', repr(f.get(k)))
          PY
      - name: K1-Max-Filamente (Kandidaten)
        run: |
          cd /tmp/orca-src/resources/profiles
          grep -l '"Creality K1 Max (0.4 nozzle)"' Creality/filament/*.json | xargs -n1 basename | head -40
      - name: Testwürfel slicen
        run: |
          python3 - <<'PY'
          import struct
          v=[(0,0,0),(20,0,0),(20,20,0),(0,20,0),(0,0,20),(20,0,20),(20,20,20),(0,20,20)]
          f=[(0,2,1),(0,3,2),(4,5,6),(4,6,7),(0,1,5),(0,5,4),(1,2,6),(1,6,5),(2,3,7),(2,7,6),(3,0,4),(3,4,7)]
          with open('/tmp/cube.stl','wb') as o:
              o.write(b'\0'*80); o.write(struct.pack('<I',len(f)))
              for t in f:
                  o.write(struct.pack('<3f',0,0,0))
                  for i in t: o.write(struct.pack('<3f',*v[i]))
                  o.write(b'\0\0')
          PY
          cd /tmp/squashfs-root
          echo "### A: ohne Display"
          mkdir -p /tmp/outA /tmp/dd
          S=$(date +%s); timeout 300 ./AppRun --datadir /tmp/dd --arrange 1 --orient 0 --slice 0 --export-statistics \
            --load-settings "/tmp/prof/machine.json;/tmp/prof/process.json" --load-filaments "/tmp/prof/filament_PLA.json" \
            --outputdir /tmp/outA /tmp/cube.stl > /tmp/sliceA.log 2>&1; echo "EXIT=$? Dauer=$(( $(date +%s)-S ))s"
          tail -15 /tmp/sliceA.log; ls -la /tmp/outA
          echo "### result.json"; cat /tmp/outA/result.json; echo
          echo "### statistics"; head -c 1500 /tmp/outA/*.statistics.json 2>/dev/null; echo
          G=/tmp/outA/plate_1.gcode
          if [ -f $G ]; then
            echo "### KOPF"; head -40 $G
            echo "### START"; grep -n -m8 "START_PRINT\|M190\|M109\|M104\|M140\|EXCLUDE_OBJECT_DEFINE\|thumbnail begin" $G
            echo "### STATISTIK-KOMMENTARE"; grep -nE "^; (estimated printing time|total filament|filament used|model printing time|total estimated time|filament_settings_id|print_settings_id|printer_settings_id)" $G
            echo "### ENDE"; grep -n "END_PRINT" $G | tail -2
          fi
      - name: Overrides testen (PETG, 0.12 mm, Stützen, Skalierung, Drehung)
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/prof/process.json'))
          p.update({"layer_height":"0.12","sparse_infill_density":"35%","wall_loops":"3","enable_support":"1","support_type":"normal(auto)","support_on_build_plate_only":"1","brim_type":"outer_only","brim_width":"5","name":"K1 Direkt Test"})
          json.dump(p,open('/tmp/p2.json','w'))
          f=json.load(open('/tmp/prof/filament_PETG.json'))
          for k in ["nozzle_temperature","nozzle_temperature_initial_layer"]: f[k]=["245"]
          for k in ["hot_plate_temp","hot_plate_temp_initial_layer","textured_plate_temp","textured_plate_temp_initial_layer"]: f[k]=["80"]
          json.dump(f,open('/tmp/f2.json','w'))
          PY
          cd /tmp/squashfs-root && mkdir -p /tmp/outB
          timeout 300 ./AppRun --datadir /tmp/dd --arrange 1 --orient 0 --slice 0 --scale 1.5 --rotate 30 \
            --load-settings "/tmp/prof/machine.json;/tmp/p2.json" --load-filaments "/tmp/f2.json" \
            --outputdir /tmp/outB /tmp/cube.stl > /tmp/sliceB.log 2>&1; echo "EXIT=$?"
          tail -10 /tmp/sliceB.log; cat /tmp/outB/result.json; echo
          G=/tmp/outB/plate_1.gcode
          [ -f $G ] && grep -nE "^START_PRINT|^; (layer_height|sparse_infill_density|enable_support|brim_width|nozzle_temperature|hot_plate_temp) =|^; (estimated printing time|total filament)" $G | head -20
          [ -f $G ] && python3 -c "
          import re
          xs=[];ys=[]
          for l in open('$G'):
              m=re.match(r'G1 X([\d.]+) Y([\d.]+)',l)
              if m: xs.append(float(m.group(1))); ys.append(float(m.group(2)))
          print('XY-Bereich', min(xs),max(xs),min(ys),max(ys))"
          echo "### Fehlerfall: zu großes Modell"
          mkdir -p /tmp/outC; timeout 120 ./AppRun --datadir /tmp/dd --arrange 1 --slice 0 --scale 20 --load-settings "/tmp/prof/machine.json;/tmp/prof/process.json" --load-filaments "/tmp/prof/filament_PLA.json" --outputdir /tmp/outC /tmp/cube.stl > /tmp/sliceC.log 2>&1; echo "EXIT=$?"; tail -5 /tmp/sliceC.log; cat /tmp/outC/result.json 2>/dev/null
