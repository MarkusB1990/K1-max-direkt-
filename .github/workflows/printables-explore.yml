name: Printables erkunden

on:
  push:
    paths: [".github/workflows/printables-explore.yml"]

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: GraphQL-Schema der Suche
        run: |
          q() { curl -s -m 20 https://api.printables.com/graphql/ -H 'Content-Type: application/json' -H 'Origin: https://www.printables.com' --data "$1"; echo; }
          echo "--- Felder von Query mit 'search'"
          q '{"query":"{ __schema { queryType { fields { name args { name } type { name kind ofType { name kind } } } } } }"}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if 'errors' in d: print(d['errors']); sys.exit()
          for f in d['data']['__schema']['queryType']['fields']:
              if 'search' in f['name'].lower():
                  t=f['type']; print(f['name'], [a['name'] for a in f['args']], t.get('name') or (t.get('ofType') or {}).get('name'))
          "
          for T in SearchPrintsResultType SearchResultType PrintSearchResultType; do
            echo "--- Typ $T"
            q "{\"query\":\"{ __type(name: \\\"$T\\\") { fields { name type { name kind ofType { name } } } } }\"}" | head -c 1500; echo
          done
      - name: Test mit totalCount-Kandidaten
        run: |
          for F in totalCount total count; do
            echo "--- Feld $F"
            curl -s -m 20 https://api.printables.com/graphql/ -H 'Content-Type: application/json' -H 'Origin: https://www.printables.com' \
              --data "{\"query\":\"query { result: searchPrints2(query: \\\"benchy\\\", limit: 2, offset: 0) { $F items { id name } } }\"}" | head -c 600; echo
          done
