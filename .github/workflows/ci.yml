name: Kompilieren prüfen

# Prüft nur, ob der Code kompiliert. Es wird kein APK gebaut.
on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin kompilieren + Lint
        run: ./gradlew --no-daemon compileDebugKotlin lintDebug
      - name: Lint-Meldungen anzeigen
        if: always()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Lint-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  slicer-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r slicer-server/requirements.txt
      - run: python -c "import sys; sys.path.insert(0, 'slicer-server'); import app"
      - name: Docker-Image bauen (wie Home Assistant, mit OrcaSlicer)
        run: docker build -t k1-slicer slicer-server
      - name: Container starten und Testwürfel slicen
        run: |
          mkdir -p /tmp/k1data
          echo '{"token":"test","parallel":1,"timeout":300}' > /tmp/k1data/options.json
          docker run -d --name k1 -p 8090:8090 -v /tmp/k1data:/data k1-slicer
          for i in $(seq 1 30); do curl -sf -H "Authorization: Bearer test" localhost:8090/health && break; sleep 1; done
          python - <<'PY'
          import struct
          v=[(0,0,0),(20,0,0),(20,20,0),(0,20,0),(0,0,20),(20,0,20),(20,20,20),(0,20,20)]
          f=[(0,2,1),(0,3,2),(4,5,6),(4,6,7),(0,1,5),(0,5,4),(1,2,6),(1,6,5),(2,3,7),(2,7,6),(3,0,4),(3,4,7)]
          with open('/tmp/cube.stl','wb') as o:
              o.write(b'\0'*80); o.write(struct.pack('<I',len(f)))
              for t in f:
                  o.write(struct.pack('<3f',0,0,0))
                  for i in t: o.write(struct.pack('<3f',*v[i]))
                  o.write(b'\0\0')
          PY
          echo "--- PLA (Standard)"
          code=$(curl -s -D /tmp/h1.txt -o /tmp/pla.gcode -w '%{http_code}' -H "Authorization: Bearer test" -F file=@/tmp/cube.stl -F material=PLA -F nozzle_temp=220 -F bed_temp=60 localhost:8090/slice)
          if [ "$code" != "200" ]; then echo "HTTP $code"; cat /tmp/pla.gcode; echo; docker logs k1 | tail -20; exit 1; fi
          grep -i "x-print-time\|x-filament" /tmp/h1.txt
          grep -m1 "^START_PRINT" /tmp/pla.gcode | tee /dev/stderr | grep -q "EXTRUDER_TEMP=220 BED_TEMP=60"
          grep -q "OrcaSlicer" /tmp/pla.gcode
          grep -E "^; filament_max_volumetric_speed = 20$" /tmp/pla.gcode
          echo "--- PETG, 0.12 mm, Stützen, Brim, schneller, skaliert + gedreht"
          curl -sf -o /tmp/petg.gcode -H "Authorization: Bearer test" -F file=@/tmp/cube.stl -F material=PETG -F nozzle_temp=245 -F bed_temp=80 \
            -F layer_height=0.12 -F support=buildplate -F brim=5 -F speed=130 -F scale=150 -F rotate=30 localhost:8090/slice
          grep -m1 "^START_PRINT" /tmp/petg.gcode | tee /dev/stderr | grep -q "EXTRUDER_TEMP=245 BED_TEMP=80"
          grep -q "^; layer_height = 0.12" /tmp/petg.gcode
          echo "--- Zu groß → verständlicher Fehler"
          code=$(curl -s -o /tmp/err.json -w '%{http_code}' -H "Authorization: Bearer test" -F file=@/tmp/cube.stl -F scale=2000 localhost:8090/slice)
          cat /tmp/err.json; echo; [ "$code" = "422" ]
          docker logs k1 | head -3

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Vorschaubilder rendern (Robolectric, kein APK)
        run: ./gradlew --no-daemon recordRoborazziDebug
      - name: Bilder ins Log schreiben
        run: for f in app/screenshots/*.png; do echo "===PNG $(basename $f)"; base64 -w 76 "$f"; echo "===END"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            app/screenshots/*.png
            app/build/reports/tests/
