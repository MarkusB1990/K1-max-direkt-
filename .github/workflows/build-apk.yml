name: APK bauen

# Baut das APK bei jedem Push auf den Entwicklungs-Branch oder manuell unter Actions → "APK bauen".
# Fest signierte Builds werden zusätzlich als GitHub-Release veröffentlicht – daraus holt sich die
# App ihre Updates (Einstellungen → App-Update).
on:
  push:
    branches: ["ccr-7592eb33-pjcy8z"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.K1_SIGNING_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        env:
          K1_SIGNING_PASSWORD: ${{ secrets.K1_SIGNING_PASSWORD }}
        run: |
          if [ -z "$K1_SIGNING_PASSWORD" ]; then
            echo "::warning::Secret K1_SIGNING_PASSWORD fehlt – APK wird mit wechselndem Debug-Schlüssel signiert."
          fi
          ./gradlew --no-daemon assembleRelease
      - name: APK benennen
        id: apk
        run: |
          VERSION="0.3.${GITHUB_RUN_NUMBER}"
          CODE=$((100 + GITHUB_RUN_NUMBER))
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/K1MaxDirekt-$VERSION.apk"
          ls -la out
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          echo "Signatur (SHA-256 des Zertifikats):"
          "$APKSIGNER" verify --print-certs out/*.apk | grep -E "SHA-256|DN"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: K1MaxDirekt-apk
          path: out/*.apk
      - name: Release für In-App-Update veröffentlichen
        # Nur fest signierte Builds – sonst ließe sich das Update nicht über die App installieren
        if: github.event_name == 'push' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
        run: |
          NOTES=$(git log -1 --pretty=%B | grep -v -E "^(Co-Authored-By|Claude-Session):" | sed '/^[[:space:]]*$/N;/^\n$/D')
          python3 - <<'PY'
          import json, os
          json.dump({"versionCode": int(os.environ["CODE"]), "versionName": os.environ["VERSION"],
                     "apk": f"K1MaxDirekt-{os.environ['VERSION']}.apk"}, open("out/version.json", "w"))
          PY
          printf '%s\n' "$NOTES" > out/notes.txt
          gh release create "v$VERSION" out/*.apk out/version.json \
            --target "$GITHUB_SHA" --title "K1 Max Direkt $VERSION" --notes-file out/notes.txt --latest
          # Nur die letzten 10 Releases behalten
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
