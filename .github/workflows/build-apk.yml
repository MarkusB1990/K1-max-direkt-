name: APK bauen

# Baut das APK bei jedem Push auf den Entwicklungs-Branch oder manuell unter Actions → "APK bauen".
# Das APK liegt danach im Lauf unter "Artifacts" zum Herunterladen bereit.
on:
  push:
    branches: ["ccr-7592eb33-pjcy8z"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        env:
          K1_SIGNING_PASSWORD: ${{ secrets.K1_SIGNING_PASSWORD }}
        run: |
          if [ -z "$K1_SIGNING_PASSWORD" ]; then
            echo "::warning::Secret K1_SIGNING_PASSWORD fehlt – APK wird mit wechselndem Debug-Schlüssel signiert."
          fi
          ./gradlew --no-daemon assembleRelease
      - name: APK benennen
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/K1MaxDirekt-$VERSION.apk"
          ls -la out
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          echo "Signatur (SHA-256 des Zertifikats):"
          "$APKSIGNER" verify --print-certs out/*.apk | grep -E "SHA-256|DN"
      - uses: actions/upload-artifact@v4
        with:
          name: K1MaxDirekt-apk
          path: out/*.apk
