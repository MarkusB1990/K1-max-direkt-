# Creality K1 Max – Basisprofil für PrusaSlicer (0,4-mm-Düse, 1,75-mm-Filament)
# Die App überschreibt Schichthöhe, Füllung, Temperaturen, Stützen usw. pro Auftrag.

# ---------- Drucker ----------
printer_technology = FFF
bed_shape = 0x0,300x0,300x300,0x300
max_print_height = 300
gcode_flavor = klipper
nozzle_diameter = 0.4
use_relative_e_distances = 1
use_firmware_retraction = 0
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.4
retract_lift_below = 299
retract_before_travel = 1
retract_layer_change = 1
wipe = 0
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 20000
machine_max_acceleration_retracting = 5000
machine_max_acceleration_travel = 20000
machine_max_acceleration_x = 20000
machine_max_acceleration_y = 20000
machine_max_acceleration_z = 500
machine_max_acceleration_e = 5000
machine_max_feedrate_x = 800
machine_max_feedrate_y = 800
machine_max_feedrate_z = 20
machine_max_feedrate_e = 100
machine_max_jerk_x = 12
machine_max_jerk_y = 12
machine_max_jerk_z = 3
machine_max_jerk_e = 3
# START_PRINT/END_PRINT sind die Makros aus der Creality-Klipper-Konfiguration des K1 Max
start_gcode = START_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]\nM83\nG92 E0
end_gcode = END_PRINT
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
gcode_label_objects = octoprint
# Heizen übernimmt das START_PRINT-Makro des Druckers
autoemit_temperature_commands = 0
gcode_comments = 0
thumbnails =

# ---------- Filament (Standard PLA, wird von der App überschrieben) ----------
filament_diameter = 1.75
filament_type = PLA
filament_density = 1.24
extrusion_multiplier = 1
temperature = 220
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 60
max_volumetric_speed = 21
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
fan_below_layer_time = 60
slowdown_below_layer_time = 4
min_print_speed = 20

# ---------- Druckeinstellungen ----------
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 4
top_solid_min_thickness = 0.8
bottom_solid_min_thickness = 0.6
fill_density = 15%
fill_pattern = grid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
infill_every_layers = 1
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
seam_position = aligned
external_perimeters_first = 0
thin_walls = 0
ensure_vertical_shell_thickness = 1

perimeter_speed = 200
external_perimeter_speed = 150
small_perimeter_speed = 100
infill_speed = 270
solid_infill_speed = 220
top_solid_infill_speed = 150
gap_fill_speed = 100
bridge_speed = 50
support_material_speed = 150
support_material_interface_speed = 80%
travel_speed = 500
travel_speed_z = 12
first_layer_speed = 50
first_layer_speed_over_raft = 50

default_acceleration = 10000
perimeter_acceleration = 5000
infill_acceleration = 10000
bridge_acceleration = 3000
first_layer_acceleration = 1000
travel_acceleration = 12000

skirts = 1
skirt_distance = 6
skirt_height = 1
min_skirt_length = 4
brim_width = 0
brim_type = outer_only

support_material = 0
support_material_auto = 1
support_material_threshold = 50
support_material_contact_distance = 0.2
support_material_spacing = 2.5
support_material_interface_layers = 2
support_material_style = snug
support_material_buildplate_only = 0
dont_support_bridges = 1

avoid_crossing_perimeters = 0
complete_objects = 0
